<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jhapat Studio</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Mukta:wght@400;600;700&display=swap">
<style>
/* Layout: desk tool. Left column holds the video, uploads and the selected-word tools (sticky); right column is the lyric list.
   Stacks to one column on phones with the video pinned on top. Same palette and type as the party player. */
:root{
  --bg:#f3f1f8; --surface:#ffffff; --raise:#ebe7f3; --ink:#221a35; --muted:#625a78; --line:#dcd6e7;
  --gold:#8f5b00; --gold-fill:#ffb000; --gold-ink:#1d1406; --gold-soft:#fff1cc;
  --red:#c8193f; --red-soft:#f7d7df; --ok:#14774a; --ok-soft:#dcf3e6; --warn:#8a4e00; --warn-soft:#fbecd2;
  --shadow:0 1px 2px rgba(34,26,53,.08), 0 6px 18px rgba(34,26,53,.07);
  --display:"Baloo 2", ui-rounded, system-ui, sans-serif;
  --body:"Mukta", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#120e1f; --surface:#1c172d; --raise:#272040; --ink:#f2eef9; --muted:#aaa1c0; --line:#352c4e;
    --gold:#ffc14d; --gold-fill:#ffb000; --gold-ink:#1d1406; --gold-soft:#3a2c0c;
    --red:#ff5c7c; --red-soft:#47202d; --ok:#4ade80; --ok-soft:#173a29; --warn:#fbbf24; --warn-soft:#3d2c0b;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--gold)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:28px;font-weight:800} h2{font-size:21px;font-weight:800} h3{font-size:17px;font-weight:800}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
code,.mono{font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:calc(12px + env(safe-area-inset-top,0px)) 10px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.brand .word{font:800 26px/1 var(--display)}
.brand .dev{font:600 17px/1 var(--display);color:var(--gold)}
.brand .tag{font:700 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:4px}
nav.tabs{display:flex;background:var(--raise);border-radius:999px;padding:3px;gap:2px}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:700 14.5px/1 var(--body);padding:9px 13px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.dhaka{height:7px;background:
  linear-gradient(135deg,var(--red) 25%,transparent 25%) -7px 0/14px 14px,
  linear-gradient(225deg,var(--red) 25%,transparent 25%) -7px 0/14px 14px,
  linear-gradient(315deg,var(--ink) 25%,transparent 25%) 0 0/14px 14px,
  linear-gradient(45deg,var(--ink) 25%,transparent 25%) 0 0/14px 14px,
  var(--gold-fill)}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;line-height:1.1}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--gold-ink)}
.btn.danger{color:var(--red)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.small{padding:5px 9px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.w:focus-visible,.chip:focus-visible{outline:3px solid var(--gold-fill);outline-offset:2px}
input[type=text],input[type=email],input[type=search],input[type=url],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.pill{display:inline-block;font:700 11.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:999px;white-space:nowrap}
.pill.draft{background:var(--raise);color:var(--muted)}
.pill.tagged{background:var(--warn-soft);color:var(--warn)}
.pill.checked{background:var(--ok-soft);color:var(--ok)}
.pill.flag{background:var(--red-soft);color:var(--red)}

/* song list */
.songs{display:grid;gap:6px}
.songrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.songrow:hover{border-color:var(--muted)}
.songrow b{font-size:16.5px}
.songrow .meta{font-size:13.5px;color:var(--muted)}
.flags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}

/* editor layout */
.layout{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:20px;align-items:start;padding-top:12px}
.layout.solo{grid-template-columns:minmax(0,1fr)}
aside.side{position:sticky;top:8px;display:grid;gap:12px;max-height:calc(100vh - 16px);overflow:auto;padding-bottom:8px}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside.side{position:static;max-height:none;overflow:visible}
  .stagewrap{position:sticky;top:0;z-index:4;background:var(--bg);padding-block:6px}
}
.screen{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:#000}
.screen>div,.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.screen .idle{display:grid;place-items:center;color:#cfc7e2;font:600 14px/1.4 var(--body);text-align:center;padding:12px;background:#000;z-index:2}
.transport{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.clock{font:600 14px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);margin-left:auto}
.clock b{color:var(--ink)}

.vids{display:grid;gap:8px}
.vid{border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:grid;gap:6px}
.vid.on{border-color:var(--gold-fill);box-shadow:inset 0 0 0 1px var(--gold-fill)}
.vid .line1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.selbar{background:var(--gold-soft);border:1px solid var(--gold-fill);border-radius:14px;padding:12px;display:grid;gap:8px}
.selbar .big{font:800 19px/1.1 var(--display)}
.tapbtn{font:800 18px/1 var(--display);padding:14px 16px}

/* lyrics */
.legend{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font:700 13.5px/1 var(--body);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .n{background:var(--raise);border-radius:999px;padding:2px 6px;font-size:12px}
.lines{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
.ln{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px;border-radius:9px}
.ln.dim{color:var(--muted)}
.ln.sel{background:var(--raise)}
.ln.now{box-shadow:inset 3px 0 0 var(--gold-fill)}
.ln .tm{font:600 13.5px/1.6 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.ln .tx{font-size:17.5px;line-height:1.6;min-width:0;overflow-wrap:anywhere}
.ln .side{display:flex;gap:5px;align-items:center}
.rep{font:700 12px/1 var(--body);padding:4px 7px;border-radius:999px;background:var(--red-soft);color:var(--red);white-space:nowrap}
.w{border:0;background:var(--gold-soft);color:var(--ink);border-radius:6px;padding:0 4px;cursor:pointer;font:inherit;line-height:inherit;box-shadow:inset 0 -2px 0 var(--gold-fill)}
.w.tagged{background:var(--gold-fill);color:var(--gold-ink);font-weight:700;box-shadow:none}
.w.tagged.picked{outline:3px solid var(--red);outline-offset:1px}
.tchips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tchip{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:2px 8px;font:600 12.5px/1.4 var(--mono);cursor:pointer;color:var(--ink)}
.tchip.tap{border-color:var(--ok);color:var(--ok)}
.tchip.picked{background:var(--gold-fill);color:var(--gold-ink);border-color:var(--gold-fill)}
.gap{height:10px;border-top:1px dashed var(--line);margin:6px 8px}
.plain{max-height:40vh;overflow:auto;display:grid;gap:2px;font-size:17px;line-height:1.55;padding-right:4px}
.plain .dim{color:var(--muted)}
.plain mark{background:var(--gold-soft);color:var(--ink);border-radius:5px;padding:0 3px;box-shadow:inset 0 -2px 0 var(--gold-fill)}

.results{display:grid;gap:6px}
.res{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.res .meta{font-size:13.5px;color:var(--muted)}
.tapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.tapgrid .btn{padding:16px 10px;font:800 17px/1 var(--display)}
table.grid{border-collapse:collapse;width:100%}
table.grid td,table.grid th{padding:8px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
table.grid th{font:700 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
.scrollx{overflow-x:auto}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:600;max-width:min(560px,calc(100vw - 32px));transition:opacity .2s,transform .2s;z-index:20}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.gate{max-width:440px;margin:40px auto;display:grid;gap:14px}
.kbd{font:600 12px/1 var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 5px;background:var(--surface)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="top wrap">
  <a class="brand" href="./"><span class="word">Jhapat</span><span class="dev" lang="ne">झपट</span><span class="tag">Studio</span></a>
  <nav class="tabs" id="nav" hidden>
    <button data-act="go" data-arg="">Songs</button>
    <button data-act="go" data-arg="items">Items</button>
    <button data-act="go" data-arg="playlists">Playlists</button>
  </nav>
  <div class="who" id="who"></div>
</header>
<div class="dhaka" aria-hidden="true"></div>
<div class="wrap">
  <div class="layout solo" id="layout">
    <aside class="side" id="side" hidden>
      <div class="stagewrap">
        <div class="screen"><div class="idle" id="idle">Load an upload to play it here.</div><div id="yt"></div></div>
        <div class="transport">
          <button class="btn small" data-act="pp" id="ppBtn">Play</button>
          <button class="btn small" data-act="skip" data-arg="-5" aria-label="Back 5 seconds">−5 s</button>
          <button class="btn small" data-act="skip" data-arg="5" aria-label="Forward 5 seconds">+5 s</button>
          <button class="btn small" data-act="rate" id="rateBtn">1×</button>
          <span class="clock" id="clock">0:00.0</span>
        </div>
      </div>
      <div id="sidePanel" class="grid"></div>
    </aside>
    <main id="view"></main>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
'use strict';
/* ---------- setup ---------- */
const SB_URL = 'https://hckzkaprxywohazohmcu.supabase.co';
const SB_KEY = 'sb_publishable_BxH35gKGU8uwTsn-jGur9g_a_L-b98T'; // public key: the database's own rules decide what it may do
const LAG = 0.25;          // seconds between hearing a word and the tap landing
const sb = window.__fakeSb || window.supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = t => { if (!isFinite(t) || t < 0) t = 0; const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };
const fmt2 = t => { if (!isFinite(t) || t < 0) t = 0; const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2); };
const r2 = x => Math.round(x * 100) / 100;
const slug = s => String(s || '').normalize('NFKD').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'song';
const norm = s => String(s || '').normalize('NFC').toLowerCase().replace(/[^\p{L}\p{M}\p{N}\s]/gu, '').replace(/\s+/g, ' ').trim();
let toastTimer = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 4200); }
function fail(what, error) { console.warn(what, error); toast(what + ': ' + ((error && error.message) || 'something went wrong') + '.'); }

/* ---------- state ---------- */
let user = null, editor = null;                 // editor: null = not checked yet
let items = [], songs = [], playlists = [];
let route = { view: 'songs', id: null };
let filter = '';
let cur = null;                                 // the open song: { s, videos, tags, lines, groups, lit, byLine, typical }
let vi = -1;                                    // index in cur.videos of the upload in the player
let pick = null;                                // { line, w, item } the word being worked on
let showAll = false, armed = null, tapAlong = [], lrc = { q: '', busy: false, list: null };
let confirmDel = false, confirmVid = null, sent = null; // confirmVid: the upload (videos.id) whose Remove is asking

/* ---------- sign-in ---------- */
let checking = null;
async function refreshUser(session) {
  const u = session ? session.user : null;
  if ((u && u.id) === (user && user.id) && (editor !== null || checking === (u && u.id))) return;
  user = u; editor = null; checking = u && u.id;
  if (user) {
    render();
    const { data, error } = await sb.rpc('is_editor');
    editor = !error && data === true;
    if (editor) await loadAll();
  }
  checking = null;
  go();
}
sb.auth.onAuthStateChange((_ev, session) => { refreshUser(session); });
sb.auth.getSession().then(({ data }) => refreshUser(data && data.session));

function gateHTML() {
  if (!user) return '<div class="gate card"><h1>Studio sign-in</h1><p class="muted">Add songs, time their lyrics and tag the item words. Only accounts on the editor list can change anything.</p>' +
    (sent ? '<p><b>Link sent to ' + esc(sent) + '.</b> Open it on this device and this page signs you in. It can take a minute to arrive.</p>' : '') +
    '<form id="signin" class="row"><label class="grow"><span class="small muted">Email</span><input type="email" id="email" autocomplete="email" required></label>' +
    '<button class="btn primary" type="submit">Email me a sign-in link</button></form></div>';
  return '<div class="gate card"><h1>Not an editor yet</h1><p>You’re signed in as <b>' + esc(user.email) + '</b>, but this account can’t change songs yet.</p>' +
    '<p class="muted small">Account ID for the editor list: <code>' + esc(user.id) + '</code></p><div class="row"><button class="btn primary" data-act="recheck">Check again</button><button class="btn" data-act="signout">Sign out</button></div></div>';
}

/* ---------- loading ---------- */
async function loadAll() {
  const [a, b, c] = await Promise.all([
    sb.from('items').select('*').order('sort'),
    sb.from('songs').select('id,title,artist,status,lrclib_id,duration,notes,lines,videos(id,yt,offset_s,synced,embeddable,rank),tags(count)').order('title'),
    sb.from('playlists').select('id,name,description,sort,is_public,owner,playlist_songs(song_id,position)').order('sort'),
  ]);
  if (a.error || b.error || c.error) return fail('Couldn’t load the studio', a.error || b.error || c.error);
  items = a.data; playlists = c.data;
  songs = b.data.map(s => ({ ...s, hasLines: Array.isArray(s.lines) && s.lines.length > 0, lines: undefined,
    tagCount: (s.tags && s.tags[0] && s.tags[0].count) || 0, needsSync: (s.videos || []).length > 0 && !(s.videos || []).some(v => v.synced && v.embeddable) }));
}
async function openSong(id) {
  const { data, error } = await sb.from('songs').select('*,videos(*),tags(*)').eq('id', id).single();
  if (error) return fail('Couldn’t open that song', error);
  cur = { s: data, videos: (data.videos || []).sort((x, y) => x.rank - y.rank || x.id - y.id), tags: (data.tags || []).sort((x, y) => x.t - y.t) };
  delete cur.s.videos; delete cur.s.tags;
  prepLines(); pick = null; armed = null; confirmDel = false; confirmVid = null; tapAlong = [];
  lrc = { q: [data.title, data.artist].filter(Boolean).join(' '), busy: false, list: null };
  const first = cur.videos.findIndex(v => v.embeddable);
  if (first > -1) loadVideo(first, false); else { vi = -1; }
}

/* ---------- lyrics: lines, repeats, item words ---------- */
function prepLines() {
  const L = cur.lines = Array.isArray(cur.s.lines) ? cur.s.lines : [];
  const gaps = L.slice(1).map((l, i) => l.t - L[i].t).filter(g => g > 0 && g <= 12).sort((a, b) => a - b);
  cur.typical = gaps.length ? gaps[Math.floor(gaps.length / 2)] : 4.5;
  cur.groups = new Map(); cur.lit = [];
  L.forEach((l, i) => {
    const k = norm(l.x);
    if (k) { if (!cur.groups.has(k)) cur.groups.set(k, []); cur.groups.get(k).push(i); }
    cur.lit.push(litWords(l.x));
  });
  assign();
}
function tokens(text) { // words with their character start
  const out = []; const re = /\S+/g; let m;
  while ((m = re.exec(text))) out.push({ w: out.length, s: m.index, x: m[0] });
  return out;
}
function itemFor(word) {
  const n = norm(word); if (!n) return null;
  for (const it of items) for (const v of (it.words || [])) { const nv = norm(v); if (nv && n.startsWith(nv)) return it.id; }
  return null;
}
function litWords(text) { return tokens(text || '').map(t => ({ ...t, item: itemFor(t.x) })).filter(t => t.item); }
const groupOf = i => { const k = norm(cur.lines[i].x); return (k && cur.groups.get(k)) || [i]; };
function estimate(i, w) {
  const L = cur.lines[i], tok = tokens(L.x)[w];
  const next = cur.lines[i + 1] ? cur.lines[i + 1].t : L.t + cur.typical;
  const dur = Math.max(0.5, Math.min(next - L.t, cur.typical));
  return r2(L.t + (tok ? tok.s / Math.max(1, L.x.length) : 0) * dur);
}
function lineAt(t) { // last line starting at or before t
  const L = cur.lines; let lo = 0, hi = L.length - 1, ans = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (L[m].t <= t + 0.05) { ans = m; lo = m + 1; } else hi = m - 1; }
  while (ans > -1 && !L[ans].x) ans--; // an instrumental gap belongs to the line before it
  return ans;
}
const lineOf = tg => (tg.line != null && cur.lines[tg.line] && Math.abs(cur.lines[tg.line].t - tg.t) < 25) ? tg.line : lineAt(tg.t);
/* Work out which tag sits on which highlighted word, line by line. */
function assign() {
  cur.byLine = new Map(); cur.loose = [];
  if (!cur.lines.length) return;
  const per = new Map();
  for (const tg of cur.tags) { const i = lineOf(tg); if (i < 0) { cur.loose.push(tg); continue; } if (!per.has(i)) per.set(i, []); per.get(i).push(tg); }
  for (const [i, tgs] of per) {
    const lit = cur.lit[i], used = new Set(), out = [];
    for (const tg of tgs) if (tg.word != null && tg.line === i && lit.some(l => l.w === tg.word && l.item === tg.item_id)) { used.add(tg.word); out.push({ tag: tg, w: tg.word }); }
    for (const tg of tgs) {
      if (out.some(o => o.tag === tg)) continue;
      let best = null, bd = 1e9;
      for (const l of lit) if (l.item === tg.item_id && !used.has(l.w)) { const d = Math.abs(estimate(i, l.w) - tg.t); if (d < bd) { bd = d; best = l.w; } }

function parseLrc(txt) {

}

  }
  // legend + lines

  h += '<div class="card"><div class="row"><h2 class="grow">Lyrics</h2><label class="row small"><input type="checkbox" id="showAll"' + (showAll ? ' checked' : '') + '> Show repeats too</label></div>' +

    '<div class="legend">' + items.filter(it => counts[it.id]).map(it => '<span class="chip">' + esc(it.name) + ' <span lang="ne">' + esc(it.dev || '') + '</span><span class="n">' + counts[it.id] + '</span></span>').join('') + '</div>';

  });

}

function stepLit(dir) {
  const order = []; cur.lines.forEach((l, i) => { if (cur.lit[i].length && (showAll || groupOf(i)[0] === i)) order.push(i); });
  if (!order.length) return;
  const at = pick ? order.indexOf(pick.line) : -1;
  const i = order[Math.max(0, Math.min(order.length - 1, at + dir))] ?? order[0];
  const lw = cur.lit[i][0];
  pick = { line: i, w: lw.w, item: lw.item }; renderSong();
  const el = document.getElementById('ln' + i); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
document.addEventListener('click', async e => {

    case 'open': location.hash = '#song:' + encodeURIComponent(arg); break;
    case 'signout': await sb.auth.signOut(); user = null; editor = null; sent = null; location.hash = '#'; render(); break;
    case 'recheck': { // added to the editor list after signing in: no reload needed
      const { data, error } = await sb.rpc('is_editor');
      if (error || data !== true) { toast('Still not on the editor list.'); break; }
      editor = true; await loadAll(); go(); break;
    }
    case 'create': await createFromLrc(Number(arg)); break;
    case 'uselrc': await useLyrics(Number(arg)); break;
    case 'word': {
      const [i, w, item] = arg.split(':'); const L = Number(i), W = Number(w);
      if (pick && groupOf(L).includes(pick.line) && pick.w === W && tagIn(L, W) && !e.altKey) { pick = null; renderSong(); break; } // second click deselects
      if (tagIn(L, W) && !e.altKey) { pick = { line: L, w: W, item }; renderSong(); break; }
      await toggleWord(L, W, item); break;
    }
    case 'unpick': pick = null; renderSong(); break;
    case 'untag': if (pick) await toggleWord(pick.line, pick.w, pick.item); break;
    case 'hear': hear(Number(arg)); break;
    case 'tapnow': tapNow(); break;
    case 'nudge': nudge(Number(arg)); break;
    case 'deltag': await delTag(Number(arg)); break;
    case 'tapitem': await tapItem(arg); break;
    case 'load': loadVideo(Number(arg), true); renderSide(); break;
    case 'pp': if (ytOk) { const st = yt.getPlayerState(); if (st === 1 || st === 3) yt.pauseVideo(); else yt.playVideo(); } break;
    case 'skip': if (ytOk) yt.seekTo(Math.max(0, now() + Number(arg)), true); break;
    case 'rate': rate = rate === 1 ? 0.75 : rate === 0.75 ? 0.5 : 1; if (ytOk) yt.setPlaybackRate(rate); b.textContent = rate + '×'; break;
    case 'off': { const [k, d] = arg.split(':'); const v = cur.videos[Number(k)]; await updateVideo(v, { offset_s: r2(Number(v.offset_s) + Number(d)), synced: true }); renderSide(); break; }
    case 'sync': {
      const k = Number(arg); if (vi !== k) loadVideo(k, true);
      const i = pick ? pick.line : cur.lines.findIndex(l => l.x);
      armed = { k, i }; renderSide();
      withYt(() => { const go2 = () => { yt.seekTo(Math.max(0, cur.lines[i].t + offset() - 6), true); yt.playVideo(); }; if (videoOn()) go2(); else setTimeout(go2, 1500); });
      break;

    case 'syncstop': armed = null; renderSide(); break;
    case 'first': { const k = Number(arg); const v = cur.videos[k]; const others = cur.videos.filter(x => x !== v);
      const res = await Promise.all([v].concat(others).map((x, r) => sb.from('videos').update({ rank: r }).eq('id', x.id)));
      if (res.some(r => r.error)) return fail('Couldn’t reorder', res.find(r => r.error).error);
      const loaded = cur.videos[vi]; cur.videos = [v].concat(others); cur.videos.forEach((x, r) => { x.rank = r; }); vi = loaded ? cur.videos.indexOf(loaded) : -1;
      renderSide(); toast('The party player tries this upload first.'); break; }
    case 'rmvid': confirmVid = Number(arg); renderSide(); break;
    case 'rmvidno': confirmVid = null; renderSide(); break;
    case 'rmvidyes': { const k = cur.videos.findIndex(x => x.id === Number(arg)), v = cur.videos[k]; confirmVid = null;
      if (!v) { renderSide(); break; }
      const { error } = await sb.from('videos').delete().eq('id', v.id); if (error) return fail('Couldn’t remove it', error);
      cur.videos.splice(k, 1); if (vi === k) { vi = -1; try { yt.stopVideo(); } catch (x) {} $('#idle').hidden = false; } else if (vi > k) vi--;
      renderSide(); toast(cur.videos.length ? 'Upload removed.' : 'Upload removed. Add another so the song plays at parties.'); break; }
    case 'trydrop': tryDrop(); break;

    case 'askdel': confirmDel = true; renderSong(); break;
    case 'nodel': confirmDel = false; renderSong(); break;
    case 'delsong': { const { error } = await sb.from('songs').delete().eq('id', cur.s.id); if (error) return fail('Couldn’t delete it', error);
      songs = songs.filter(s => s.id !== cur.s.id); cur = null; vi = -1; location.hash = '#'; toast('Deleted.'); break; }
    case 'saveitem': await saveItem(arg); break;
    case 'saveplay': await savePlaylist(arg); break;

});

async function lrcSearchOnly(q) {
  try {
    const r = await fetch('https://lrclib.net/api/search?q=' + encodeURIComponent(q)); const list = await r.json(), seen = new Set();
    lrc.list = (Array.isArray(list) ? list : []).filter(x => { const k = (x.syncedLyrics || x.plainLyrics || '').slice(0, 200) + '|' + Math.round(x.duration || 0); if (seen.has(k)) return false; seen.add(k); return true; })
      .sort((a, b) => (!!b.syncedLyrics - !!a.syncedLyrics)).slice(0, 12);
  } catch (e) { lrc.list = []; toast('LRCLIB didn’t answer. Try again in a moment.'); }
  lrc.busy = false;
}
async function createSong(row) {
  let id = slug(row.title); while (songs.some(s => s.id === id)) id += '-2';
  const { data, error } = await sb.from('songs').insert({ id, status: 'draft', ...row }).select('id,title,artist,status,lrclib_id,duration,notes').single();
  if (error) return fail('Couldn’t add the song', error);
  songs.push({ ...data, hasLines: !!(row.lines && row.lines.length), tagCount: 0, needsSync: false, videos: [] }); songs.sort((a, b) => a.title.localeCompare(b.title));
  lrc = { q: '', busy: false, list: null }; location.hash = '#song:' + encodeURIComponent(id);
  toast('Added. Now paste a YouTube link for it.');
}
async function createFromLrc(id) {
  const x = (lrc.list || []).find(r => r.id === id); if (!x) return;
  const lines = parseLrc(x.syncedLyrics);
  await createSong({ title: x.trackName, artist: x.artistName || null, lrclib_id: x.id, duration: x.duration || null, lines: lines.length ? lines : null, plain_lyrics: x.plainLyrics || null });
}
async function syncTap() {
  if (!armed || !videoOn()) return;
  const v = cur.videos[armed.k], line = cur.lines[armed.i];
  const off = r2(now() - LAG - line.t);
  if (await updateVideo(v, { offset_s: off, synced: true })) { toast('Synced: this upload runs ' + Math.abs(off).toFixed(2) + ' s ' + (off >= 0 ? 'behind' : 'ahead of') + ' the lyrics.'); }
  armed = null; renderSide();
}
function tryDrop() {
  const v = cur.videos[vi]; if (!v || !cur.tags.length) return;
  const tg = cur.tags[Math.floor(Math.random() * cur.tags.length)];
  const prev = cur.tags.filter(t => t.t < tg.t - 0.01).pop();
  const room = prev ? tg.t - prev.t - 1.2 : tg.t + offset();
  const lead = room >= 7 ? 7 + Math.random() * (Math.min(10, room) - 7) : Math.max(1, room);
  const at = tg.t + offset() - lead;
  withYt(() => { yt.seekTo(Math.max(0, at), true); yt.playVideo(); });
  toast('Dropped in ' + lead.toFixed(1) + ' s before ' + itemName(tg.item_id) + ' (' + fmt2(tg.t + offset()) + ').');
}

async function movePl(arg) {

  const ps = (p.playlist_songs || []).slice().sort((a, b) => a.position - b.position), i = Number(k), j = i + Number(d);

}
document.addEventListener('keydown', e => {
  if (!cur || e.metaKey || e.ctrlKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const k = e.key;
  if (k === ' ') { e.preventDefault(); $('#ppBtn').click(); }
  else if (k === 't' || k === 'T') { if (armed) syncTap(); else tapNow(); }
  else if (k === 'h' || k === 'H') { if (pick) hear(pick.line); }
  else if (k === 'ArrowLeft' && pick) { e.preventDefault(); nudge(-0.1); }
  else if (k === 'ArrowRight' && pick) { e.preventDefault(); nudge(0.1); }
  else if (k === 'ArrowDown') { e.preventDefault(); stepLit(1); }
  else if (k === 'ArrowUp') { e.preventDefault(); stepLit(-1); }
  else if (k === 'Escape') { pick = null; armed = null; renderSong(); }
});
go();
})();
</script>
</body>
</html>
