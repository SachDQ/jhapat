<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jhapat Studio</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Mukta:wght@400;600;700&family=Yatra+One&display=swap">
<style>
/* Layout: desk tool. Left column holds the video, uploads and the selected-word tools (sticky); right column is the lyric list.
   Stacks to one column on phones with the video pinned on top. Same palette and type as the party player. */
:root{
  --bg:#f3f1f8; --surface:#ffffff; --raise:#ebe7f3; --ink:#221a35; --muted:#625a78; --line:#dcd6e7;
  --gold:#8f5b00; --gold-fill:#ffb000; --gold-ink:#1d1406; --gold-soft:#fff1cc;
  --red:#c8193f; --red-soft:#f7d7df; --ok:#14774a; --ok-soft:#dcf3e6; --warn:#8a4e00; --warn-soft:#fbecd2;
  --new:#0b6e7d; --new-soft:#e0f4f6;
  --shadow:0 1px 2px rgba(34,26,53,.08), 0 6px 18px rgba(34,26,53,.07);
  --display:"Baloo 2", ui-rounded, system-ui, sans-serif;
  --body:"Mukta", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#120e1f; --surface:#1c172d; --raise:#272040; --ink:#f2eef9; --muted:#aaa1c0; --line:#352c4e;
    --gold:#ffc14d; --gold-fill:#ffb000; --gold-ink:#1d1406; --gold-soft:#3a2c0c;
    --red:#ff5c7c; --red-soft:#47202d; --ok:#4ade80; --ok-soft:#173a29; --warn:#fbbf24; --warn-soft:#3d2c0b;
    --new:#5eead4; --new-soft:#0f3034;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--gold)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:28px;font-weight:800} h2{font-size:21px;font-weight:800} h3{font-size:17px;font-weight:800}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
code,.mono{font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:calc(12px + env(safe-area-inset-top,0px)) 10px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.brand .word{font:400 27px/1 "Yatra One", var(--display)} /* the party player's mark (Tihar Night) */
.brand .dev{font:400 19px/1 "Yatra One", var(--display);color:var(--gold)}
.brand .tag{font:700 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:4px}
nav.tabs{display:flex;background:var(--raise);border-radius:999px;padding:3px;gap:2px}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:700 14.5px/1 var(--body);padding:9px 13px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.garland{height:16px;background-image:radial-gradient(circle,#FF8A00 0 5.5px,transparent 6.5px),radial-gradient(circle,#FFC233 0 3px,transparent 4px);
  background-size:16px 16px,16px 16px;background-position:0 0,8px 0;background-repeat:repeat-x} /* the player's marigold garland */

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;line-height:1.1}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--gold-ink)}
.btn.danger{color:var(--red)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.small{padding:5px 9px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.w:focus-visible,.chip:focus-visible{outline:3px solid var(--gold-fill);outline-offset:2px}
input[type=text],input[type=email],input[type=search],input[type=url],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.pill{display:inline-block;font:700 11.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:999px;white-space:nowrap}
.pill.draft{background:var(--raise);color:var(--muted)}
.pill.tagged{background:var(--warn-soft);color:var(--warn)}
.pill.checked{background:var(--ok-soft);color:var(--ok)}
.pill.auto{background:var(--new-soft);color:var(--new)}
.pill.flag{background:var(--red-soft);color:var(--red)}

/* song list */
.songs{display:grid;gap:6px}
.songrow{display:grid;grid-template-columns:112px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px 8px 8px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.songrow:hover{border-color:var(--muted)}
.songrow .info{display:grid;gap:3px;min-width:0}
.songrow .t{font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.songrow .meta{font-size:13.5px;color:var(--muted)}
.flags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.thumb{width:112px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--raise);display:grid;place-items:center;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.sm{width:64px;border-radius:6px}
.thumb.fl{float:left;margin:2px 10px 4px 0}
.nothumb{font:800 20px/1 var(--display);color:var(--muted)}
img.broken{visibility:hidden}
.its{display:flex;gap:5px;flex-wrap:wrap}
.its .it{display:inline-flex;gap:3px;align-items:center;background:var(--raise);border-radius:999px;padding:0 7px;font-size:13px;line-height:1.6}
.its .it b{font-size:12px;color:var(--muted)}
@media (max-width:640px){.songrow{grid-template-columns:84px minmax(0,1fr)}.songrow .thumb{width:84px}.songrow .flags{grid-column:2;justify-content:flex-start}}

/* editor layout */
.layout{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:20px;align-items:start;padding-top:12px}
.layout.solo{grid-template-columns:minmax(0,1fr)}
aside.side{position:sticky;top:8px;display:grid;gap:12px;max-height:calc(100vh - 16px);overflow:auto;padding-bottom:8px}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside.side{position:static;max-height:none;overflow:visible}
  .stagewrap{position:sticky;top:0;z-index:4;background:var(--bg);padding-block:6px}
}
.screen{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:#000}
.screen>div,.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.screen .idle{display:grid;place-items:center;color:#cfc7e2;font:600 14px/1.4 var(--body);text-align:center;padding:12px;background:#000;z-index:2}
.transport{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.clock{font:600 14px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);margin-left:auto}
.clock b{color:var(--ink)}

.vids{display:grid;gap:8px}
.vid{border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:grid;gap:6px}
.vid.on{border-color:var(--gold-fill);box-shadow:inset 0 0 0 1px var(--gold-fill)}
.vid .line1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.selbar{background:var(--gold-soft);border:1px solid var(--gold-fill);border-radius:14px;padding:12px;display:grid;gap:8px}
.selbar.check{background:var(--new-soft);border-color:var(--new)}
.countdown{font:800 46px/1 var(--display);text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;padding:2px 0}
.countdown.hit{color:var(--red)}
.selbar .big{font:800 19px/1.1 var(--display)}
.tapbtn{font:800 18px/1 var(--display);padding:14px 16px}

/* lyrics */
.legend{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font:700 13.5px/1 var(--body);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .n{background:var(--raise);border-radius:999px;padding:2px 6px;font-size:12px}
.lines{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
.ln{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px;border-radius:9px}
.ln.dim{color:var(--muted)}
.ln.sel{background:var(--raise)}
.ln.now{box-shadow:inset 3px 0 0 var(--gold-fill)}
.ln .tm{font:600 13.5px/1.6 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.ln .tx{font-size:17.5px;line-height:1.6;min-width:0;overflow-wrap:anywhere}
.ln .side{display:flex;gap:5px;align-items:center}
.rep{font:700 12px/1 var(--body);padding:4px 7px;border-radius:999px;background:var(--red-soft);color:var(--red);white-space:nowrap}
/* item words: dashed = not tagged yet, light gold = estimated automatically, solid gold = timed or checked by ear */
.w,.wk{border:1.5px dashed var(--new);background:var(--new-soft);color:var(--ink);border-radius:6px;padding:0 4px;cursor:pointer;font:inherit;line-height:inherit}
.w.auto,.wk.auto{border:1.5px solid transparent;background:var(--gold-soft);box-shadow:inset 0 -2px 0 var(--gold-fill)}
.w.tagged,.wk.tagged{border:1.5px solid var(--gold-fill);background:var(--gold-fill);color:var(--gold-ink);font-weight:700;box-shadow:none}
.w.picked{outline:3px solid var(--red);outline-offset:1px}
.newbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--new-soft);border:1.5px dashed var(--new);border-radius:12px;padding:10px 12px}
.chip .nn{background:var(--new-soft);color:var(--new)}
.keyrow{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.wk{cursor:default}
.opts{display:grid;gap:4px;margin:8px 0 4px}
.opt{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.okc{color:var(--ok)} .warnc{color:var(--warn)}
.res.imp{align-items:start}
.tchips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tchip{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:2px 8px;font:600 12.5px/1.4 var(--mono);cursor:pointer;color:var(--ink)}
.tchip.tap{border-color:var(--ok);color:var(--ok)}
.tchip.picked{background:var(--gold-fill);color:var(--gold-ink);border-color:var(--gold-fill)}
.gap{height:10px;border-top:1px dashed var(--line);margin:6px 8px}
.plain{max-height:40vh;overflow:auto;display:grid;gap:2px;font-size:17px;line-height:1.55;padding-right:4px}
.plain .dim{color:var(--muted)}
.plain mark{background:var(--gold-soft);color:var(--ink);border-radius:5px;padding:0 3px;box-shadow:inset 0 -2px 0 var(--gold-fill)}
.plain .done{color:var(--muted)}.plain .done .tt{font:600 12px/1 var(--mono, ui-monospace, monospace);margin-right:6px}
.plain .cur{background:var(--gold-soft);border-radius:8px;padding:2px 6px;margin-inline:-6px;font-weight:700}.plain .skip{color:var(--muted);text-decoration:line-through}
.tnext{font:800 21px/1.3 var(--display);overflow-wrap:anywhere}.tthen{color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.tnext mark,.tthen mark{background:var(--gold-fill);color:var(--ink);border-radius:5px;padding:0 3px}

.results{display:grid;gap:6px}
.res{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.res .meta{font-size:13.5px;color:var(--muted)}
.tapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.tapgrid .btn{padding:16px 10px;font:800 17px/1 var(--display)}
table.grid{border-collapse:collapse;width:100%}
table.grid td,table.grid th{padding:8px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
table.grid th{font:700 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
.scrollx{overflow-x:auto}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:600;max-width:min(560px,calc(100vw - 32px));transition:opacity .2s,transform .2s;z-index:20}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.gate{max-width:440px;margin:40px auto;display:grid;gap:14px}
.kbd{font:600 12px/1 var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 5px;background:var(--surface)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.chev{transition:none}}
/* page heads, filters and sorting */
.pagehead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:14px 10px}
.pagehead h1{flex:1 1 auto}
.pagehead form{flex:0 1 auto;flex-wrap:nowrap}
.pagehead form input{width:220px;max-width:50vw}
.count{font:700 13px/1 var(--body);color:var(--muted);background:var(--raise);border-radius:999px;padding:4px 9px;vertical-align:middle;margin-left:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.toolbar input[type=search]{flex:1 1 220px;width:auto;min-width:0}
.toolbar select{width:auto;flex:0 1 auto;max-width:100%}
.segs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 11px;font:700 13.5px/1 var(--body);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg .n{font-size:12px;color:var(--muted)}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg[aria-pressed="true"] .n{color:inherit;opacity:.75}
.empty{display:grid;gap:8px;justify-items:start;padding:14px 4px}
/* cards that fold: the head is a button with a one-line summary */
.fold{gap:0}
.foldhead{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.foldhead .ft{font:800 17px/1.15 var(--display)}
.foldhead .fs{flex:1;min-width:0;font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 3px 3px auto;flex:none;transition:transform .15s}
[aria-expanded="true"]>.chev{transform:rotate(225deg);margin:3px 3px 0 auto}
.foldbody{display:grid;gap:10px;margin-top:12px;min-width:0}
.foldhead:focus-visible,.seg:focus-visible,.itile:focus-visible{outline:3px solid var(--gold-fill);outline-offset:2px}
/* items: compact tiles; the one being edited opens above them */
.itiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.itile{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 11px;cursor:pointer}
.itile:hover{border-color:var(--muted)}
.itile.on{border-color:var(--gold-fill);box-shadow:inset 0 0 0 1px var(--gold-fill)}
.itile .ie{grid-row:span 2;font-size:26px;line-height:1}
.itile .in{display:flex;gap:6px;align-items:baseline;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.itile .in span{color:var(--muted);font-size:14px}
.itile .ic{font-size:12.5px;color:var(--muted)}
.more{margin-top:10px}
.itemed{margin-bottom:12px;border-color:var(--gold-fill);box-shadow:var(--shadow)}
.edgrid{display:grid;grid-template-columns:90px minmax(0,1fr) minmax(0,1fr);gap:10px}
.edgrid label{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted);align-content:start}
.edgrid label.wide{grid-column:1/-1}
.edgrid input,.edgrid textarea{font-weight:400;color:var(--ink)}
.edgrid .small{font-weight:400}
textarea{resize:vertical}
@media (max-width:640px){.edgrid{grid-template-columns:80px minmax(0,1fr)}.edgrid label:nth-child(3){grid-column:1/-1}}
/* playlists: folded cards with their covers fanned out */
.pls{display:grid;gap:10px}
.plhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;flex:1;min-width:0}
.plhead .pt{font:800 19px/1.15 var(--display)}
.plhead .pd{font-size:13.5px;color:var(--muted)}
.fan{position:relative;width:96px;height:60px;flex:none}
.fan .thumb{position:absolute;width:62px;border:2px solid var(--surface);box-shadow:0 3px 8px rgba(0,0,0,.25)}
.fan .thumb:nth-child(1){left:0;top:20px;transform:rotate(-9deg)}
.fan .thumb:nth-child(2){left:16px;top:4px;transform:rotate(4deg)}
.fan .thumb:nth-child(3){left:31px;top:22px;transform:rotate(10deg)}
.plrow{display:grid;grid-template-columns:22px 64px minmax(0,1fr) auto;gap:10px;align-items:center}
.addres{display:grid;gap:6px}
.addres .plrow{grid-template-columns:64px minmax(0,1fr) auto}
.plbtns{display:flex;gap:2px}
.ver{font:600 12px/1 var(--mono);color:var(--muted)}
</style>
</head>
<body>
<header class="top wrap">
  <a class="brand" href="./"><span class="word">Jhapat</span><span class="dev" lang="ne">झपट</span><span class="tag">Studio</span><span class="ver" id="ver"></span></a>
  <button class="btn small primary" id="update" data-act="update" hidden>New version · Reload</button>
  <nav class="tabs" id="nav" hidden>
    <button data-act="go" data-arg="">Songs</button>
    <button data-act="go" data-arg="items">Items</button>
    <button data-act="go" data-arg="playlists">Playlists</button>
  </nav>
  <div class="who" id="who"></div>
</header>
<div class="garland" aria-hidden="true"></div>
<div class="wrap">
  <div class="layout solo" id="layout">
    <aside class="side" id="side" hidden>
      <div class="stagewrap">
        <div class="screen"><div class="idle" id="idle">Load an upload to play it here.</div><div id="yt"></div></div>
        <div class="transport">
          <button class="btn small" data-act="pp" id="ppBtn">Play</button>
          <button class="btn small" data-act="skip" data-arg="-5" aria-label="Back 5 seconds">−5 s</button>
          <button class="btn small" data-act="skip" data-arg="5" aria-label="Forward 5 seconds">+5 s</button>
          <button class="btn small" data-act="rate" id="rateBtn">1×</button>
          <span class="clock" id="clock">0:00.0</span>
        </div>
      </div>
      <div id="sidePanel" class="grid"></div>
    </aside>
    <main id="view"></main>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
'use strict';
/* ---------- setup ---------- */
const SB_URL = 'https://hckzkaprxywohazohmcu.supabase.co';
const SB_KEY = 'sb_publishable_BxH35gKGU8uwTsn-jGur9g_a_L-b98T'; // public key: the database's own rules decide what it may do
const LAG = 0.25;          // seconds between hearing a word and the tap landing
const sb = window.__fakeSb || window.supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);

function parseYT(input) {

/* ---------- LRCLIB ---------- */
function parseLrc(txt) {
  const out = [];

    const m = raw.match(/^((?:\s*\[\d+:\d+(?:[.:]\d+)?\])+)(.*)$/); if (!m) continue;
    const text = m[2].trim();
    for (const ts of m[1].match(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)) { const [, mm, ss] = ts.match(/\[(\d+):(\d+(?:[.:]\d+)?)\]/); out.push({ t: r2(+mm * 60 + parseFloat(ss.replace(':', '.'))), x: text }); }
  }
  return out.sort((a, b) => a.t - b.t);
}
/* LRCLIB limits how fast one address may ask: about 45 requests a minute from a browser. Requests are spaced out, and a
   "too many requests" answer waits as long as LRCLIB says (Retry-After) and asks again instead of passing for "no lyrics";
   if LRCLIB stays busy the request throws { busy: true }. */

let lrcLast = 0;
async function lrcJSON(path) {
  const { gap, wait } = lrcPace();

    const pause = lrcLast + gap - Date.now(); if (pause > 0) await new Promise(res => setTimeout(res, pause));
    lrcLast = Date.now();
    const r = await fetch('https://lrclib.net' + path);
    if (r.status === 404) return null;
    const j = await r.json().catch(() => null);
    const busy = r.status === 429 || r.status >= 500 || (j && !Array.isArray(j) && (j.statusCode === 429 || j.name === 'RateLimitExceeded'));
    if (!busy) return j;

    let after = 0; try { after = Number(r.headers && r.headers.get && r.headers.get('retry-after')) || 0; } catch (e) {}
    await new Promise(res => setTimeout(res, Math.min(60000, Math.max(wait * (k + 1), after * 1000 * (1 + Math.random() * 0.3)))));
  }
}

  const list = await lrcJSON('/api/search?q=' + encodeURIComponent(q));
  const seen = new Set();
  return (Array.isArray(list) ? list : []).filter(x => { const k = (x.syncedLyrics || x.plainLyrics || '').slice(0, 200) + '|' + Math.round(x.duration || 0); if (seen.has(k)) return false; seen.add(k); return true; })

}

  lrc.busy = false; renderSong();

}
async function importAdd() {
  if (!imp.rows || imp.busy) return;
  imp.busy = true; renderImport();
  let made = 0;
  for (const r of imp.rows) {
    if (r.dupe || r.done || !r.cands) continue;
    const plan = impPlan(r), x = r.cands.find(c => c.id === r.pick) || null, lines = x ? parseLrc(x.syncedLyrics) : [];
    let id = slug(r.title); while (songs.some(s => s.id === id)) id += '-2';
    const song = { id, title: r.title, artist: r.artist || (x && x.artistName) || null, status: 'draft', lrclib_id: x ? x.id : null, duration: x ? (x.duration || null) : null,
      lines: lines.length ? lines : null, plain_lyrics: x ? (x.plainLyrics || null) : null };
    const a = await sb.from('songs').insert(song).select('id').single();
    if (a.error) { fail('Couldn’t add ' + r.title, a.error); continue; }
    const videos = [];
    if (r.yt && r.len !== 'blocked') {
      const v = await sb.from('videos').insert({ song_id: id, yt: r.yt, kind: 'official', rank: 0, duration: typeof r.len === 'number' ? r.len : null, synced: plan.kind === 'auto' }).select().single();
      if (v.error) fail('Couldn’t add the upload for ' + r.title, v.error); else videos.push(v.data);
    }
    let n = 0, ctx = null;
    if (lines.length) { try { ctx = prepLines({ s: { id, lines }, tags: [] }); n = await autoTag(ctx); } catch (e) { fail('Couldn’t tag ' + r.title, e); } }
    if (plan.kind === 'auto' && n) { const u = await sb.from('songs').update({ status: 'auto' }).eq('id', id); if (!u.error) song.status = 'auto'; }
    const p = playlists.find(q => q.id === imp.pl);
    if (p) { const pos = (p.playlist_songs || []).length, e = await sb.from('playlist_songs').insert({ playlist_id: p.id, song_id: id, position: pos }); if (!e.error) (p.playlist_songs = p.playlist_songs || []).push({ song_id: id, position: pos }); }
    songs.push(rowOf({ ...song, lines: undefined, plain_lyrics: undefined, created_at: new Date().toISOString(), hasLines: lines.length > 0, videos, tags: ctx ? ctx.tags : [] }));
    r.done = id; r.made = { status: song.status, tags: n }; made++; renderImport();
  }
  songs.sort((q, w) => q.title.localeCompare(w.title));
  imp.busy = false; renderImport();
  toast(made ? 'Added ' + made + ' song' + (made === 1 ? '' : 's') + '.' : 'Nothing new to add.');
}
function importHTML() {
  const rows = imp.rows || [], plans = rows.map(r => (r.cands || r.dupe ? impPlan(r) : null));
  const count = k => plans.filter(q => q && q.kind === k).length, todo = rows.filter(r => !r.dupe && !r.done && r.cands).length, waiting = rows.filter(r => r.failed).length;
  return '<div class="row" style="padding-block:14px"><a class="btn small ghost" href="#">← Songs</a><h1 class="grow">Add many songs</h1></div>' +
    '<div class="card"><p class="muted">One song per line: <code>Title - Artist | YouTube link</code>. A length after it, like <code>| 3:40</code>, saves measuring the upload; <code>| lrclib:12345</code> picks that LRCLIB version. ' +
    'When a song’s timed lyrics are the same length as its upload, every item word is tagged automatically and it goes live as <span class="pill auto">auto</span>. Anything else comes in as a draft.</p>' +
    '<textarea id="impText" rows="7" placeholder="Kaha Hola Ghar - Karma Band | https://youtu.be/jU7L4KDAT6w">' + esc(imp.text) + '</textarea>' +
    '<div class="row"><label class="row small">Add to <select id="impPl" style="width:auto"><option value="">no playlist</option>' + playlists.map(q => '<option value="' + esc(q.id) + '"' + (imp.pl === q.id ? ' selected' : '') + '>' + esc(q.name) + '</option>').join('') + '</select></label>' +
    '<span class="grow"></span><button class="btn primary" data-act="impfind"' + (imp.busy ? ' disabled' : '') + '>' + (imp.busy && !rows.some(r => r.done) ? 'Looking…' : rows.some(r => r.failed) ? 'Find again' : 'Find lyrics and lengths') + '</button></div></div>' +
    (rows.length ? '<div class="results" style="margin-top:12px">' + rows.map((r, k) => impRowHTML(r, k, plans[k])).join('') + '</div>' +
      '<div class="row" style="margin-top:12px"><span class="grow small muted">' + count('auto') + ' auto · ' + count('draft') + ' draft' + (count('skip') ? ' · ' + count('skip') + ' already here' : '') + (waiting ? ' · ' + waiting + ' waiting for LRCLIB' : '') + '</span>' +
      '<button class="btn primary" data-act="impadd"' + (todo && !imp.busy ? '' : ' disabled') + '>Add ' + todo + ' song' + (todo === 1 ? '' : 's') + '</button></div>' : '');
}
function impRowHTML(r, k, plan) {
  const len = typeof r.len === 'number' ? r.len : null;
  const head = (r.yt ? thumbHTML(r.yt, 'sm fl') : '') + '<b>' + esc(r.title) + '</b>' + (r.artist ? ' · ' + esc(r.artist) : '') + '<br><span class="meta">' +
    (r.yt ? 'youtu.be/' + esc(r.yt) + ' · ' + (len ? fmtLen(len) : r.len === 'blocked' ? 'won’t play outside YouTube' : r.cands ? 'length unknown' : 'measuring…') : 'no upload') + '</span>';
  if (r.done) return '<div class="res imp"><span>' + head + '<div class="small okc">Added as ' + esc(r.made.status) + (r.made.tags ? ' with ' + r.made.tags + ' tags' : '') + '.</div></span><a class="btn small" href="#song:' + esc(r.done) + '">Open</a></div>';
  if (r.dupe) return '<div class="res imp"><span>' + head + '<div class="small muted">Already in the studio.</div></span><a class="btn small ghost" href="#song:' + esc(r.dupe.id) + '">Open</a></div>';
  if (r.failed) return '<div class="res imp"><span>' + head + '<div class="small warnc">LRCLIB was busy and didn’t answer. Press Find again in a minute; this one won’t be added until then.</div></span></div>';
  if (!r.cands) return '<div class="res imp"><span>' + head + '</span><span class="small muted">Looking…</span></div>';
  const opts = r.cands.map(x => {
    const d = len && x.duration ? Math.round(x.duration - len) : null, lit = x.syncedLyrics ? parseLrc(x.syncedLyrics).reduce((n, l) => n + litWords(l.x).length, 0) : 0;
    return '<label class="opt"><input type="radio" name="pk' + k + '" data-imp="' + k + '" value="' + x.id + '"' + (r.pick === x.id ? ' checked' : '') + '> <b>' + fmtLen(x.duration) + '</b> · ' + (x.syncedLyrics ? 'timed' : 'plain only') +
      (d == null ? '' : Math.abs(d) <= 2 ? ' · <b class="okc">same length</b>' : ' · <span class="warnc">' + Math.abs(d) + ' s ' + (d > 0 ? 'longer' : 'shorter') + '</span>') +
      (x.syncedLyrics ? ' · ' + lit + ' item word' + (lit === 1 ? '' : 's') : '') + ' <span class="muted">' + esc(x.trackName) + ' – ' + esc(x.artistName) + '</span></label>';
  }).join('') + '<label class="opt"><input type="radio" name="pk' + k + '" data-imp="' + k + '" value="0"' + (!r.pick ? ' checked' : '') + '> No lyrics (tap along later)</label>';
  return '<div class="res imp"><span>' + head + (r.cands.length ? '' : '<div class="small muted">Not on LRCLIB.</div>') + '<div class="opts">' + opts + '</div>' +
    '<div class="small ' + (plan.kind === 'auto' ? 'okc' : 'warnc') + '">' + esc(plan.text) + '</div></span></div>';
}
async function createSong(row) {
  let id = slug(row.title); while (songs.some(s => s.id === id)) id += '-2';
  const { data, error } = await sb.from('songs').insert({ id, status: 'draft', ...row }).select('id,title,artist,status,lrclib_id,duration,notes,created_at').single();
  if (error) return fail('Couldn’t add the song', error);
  songs.push(rowOf({ ...data, created_at: data.created_at || new Date().toISOString(), hasLines: !!(row.lines && row.lines.length), videos: [], tags: [] })); songs.sort((a, b) => a.title.localeCompare(b.title));
  lrc = { q: '', busy: false, list: null }; location.hash = '#song:' + encodeURIComponent(id);
  toast('Added. Now paste a YouTube link for it.');
}
async function createFromLrc(id) {
  const x = (lrc.list || []).find(r => r.id === id); if (!x) return;
  const lines = parseLrc(x.syncedLyrics);
  await createSong({ title: x.trackName, artist: x.artistName || null, lrclib_id: x.id, duration: x.duration || null, lines: lines.length ? lines : null, plain_lyrics: x.plainLyrics || null });
}
async function syncTap() {
  if (!armed || !videoOn()) return;
  const v = cur.videos[armed.k], line = cur.lines[armed.i];
  const off = r2(now() - LAG - line.t);
  if (await updateVideo(v, { offset_s: off, synced: true })) { toast('Synced: this upload runs ' + Math.abs(off).toFixed(2) + ' s ' + (off >= 0 ? 'behind' : 'ahead of') + ' the lyrics.'); }
  armed = null; renderSide();
}
function tryDrop() {
  const v = cur.videos[vi]; if (!v || !cur.tags.length) return;
  const tg = cur.tags[Math.floor(Math.random() * cur.tags.length)];
  const prev = cur.tags.filter(t => t.t < tg.t - 0.01).pop();
  const room = prev ? tg.t - prev.t - 1.2 : tg.t + offset();
  const lead = room >= 7 ? 7 + Math.random() * (Math.min(10, room) - 7) : Math.max(1, room);
  const at = tg.t + offset() - lead;
  withYt(() => { yt.seekTo(Math.max(0, at), true); yt.playVideo(); });
  toast('Dropped in ' + lead.toFixed(1) + ' s before ' + itemName(tg.item_id) + ' (' + fmt2(tg.t + offset()) + ').');
}
async function saveItem(id) {
  const f = $('#itemEd'); if (!f) return;
  const val = k => f.querySelector('[data-f="' + k + '"]').value.trim();
  const words = val('words').split(/[,\n]/).map(x => x.trim()).filter(Boolean);
  const patch = { name: val('name'), dev: val('dev') || null, emoji: val('emoji') || null, words, note: val('note') || null };
  if (!patch.name) { toast('Give the item a name.'); return; }
  if (!id) {
    let nid = slug(patch.name); while (items.some(i => i.id === nid)) nid += '-2';
    const { data, error } = await sb.from('items').insert({ id: nid, ...patch, words: words.length ? words : [patch.name.toLowerCase()], sort: items.length }).select().single();
    if (error) return fail('Couldn’t add the item', error);
    items.push(data); spell = null; itemEd = data.id; render(); toast(patch.name + ' added. Auto-tag all songs to tag its words everywhere.');
    return;
  }
  const { error } = await sb.from('items').update(patch).eq('id', id);
  if (error) return fail('Couldn’t save', error);
  Object.assign(items.find(i => i.id === id), patch); spell = null; render(); toast('Saved ' + patch.name + '.');
}
async function savePlaylist(id) {
  const card = document.querySelector('[data-plid="' + CSS.escape(id) + '"]'); if (!card) return;
  const patch = { name: card.querySelector('[data-pf="name"]').value.trim(), description: card.querySelector('[data-pf="description"]').value.trim() || null };
  const { error } = await sb.from('playlists').update(patch).eq('id', id);
  if (error) return fail('Couldn’t save', error);
  Object.assign(playlists.find(p => p.id === id), patch); toast('Saved.');
}
async function movePl(arg) {
  const [pid, k, d] = arg.split(':'); const p = playlists.find(x => x.id === pid); if (!p) return;
  const ps = (p.playlist_songs || []).slice().sort((a, b) => a.position - b.position), i = Number(k), j = i + Number(d);
  if (!ps[j]) return; [ps[i], ps[j]] = [ps[j], ps[i]];
  const res = await Promise.all(ps.map((x, n) => sb.from('playlist_songs').update({ position: n }).eq('playlist_id', pid).eq('song_id', x.song_id)));
  if (res.some(r => r.error)) return fail('Couldn’t reorder', res.find(r => r.error).error);
  ps.forEach((x, n) => { x.position = n; }); p.playlist_songs = ps; render();
}
document.addEventListener('keydown', e => {
  if (!cur || e.metaKey || e.ctrlKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const k = e.key;
  if (chk) { // Check tags: Enter right, R again, arrows move the word, Esc stops
    if (k === 'Enter') { if (e.target.tagName !== 'BUTTON') { e.preventDefault(); checkOk(); } }
    else if (k === 'r' || k === 'R') checkPlay();
    else if (k === 'ArrowLeft') { e.preventDefault(); checkNudge(-0.1); }
    else if (k === 'ArrowRight') { e.preventDefault(); checkNudge(0.1); }
    else if (k === 'Escape') { chk = null; renderSong(); }
    else if (k === ' ') { e.preventDefault(); $('#ppBtn').click(); }
    return;
  }
  if (timing) { // timing the lines: T line starts, A again, S skip, Backspace undo
    if (k === 't' || k === 'T' || k === 'Enter') { if (e.target.tagName !== 'BUTTON' || k !== 'Enter') { e.preventDefault(); timeTap('line'); } return; }
    if (k === 'a' || k === 'A') { timeTap('again'); return; }
    if (k === 's' || k === 'S') { timeTap('skip'); return; }
    if (k === 'Backspace') { e.preventDefault(); timeUndo(); return; }
  }
  if (k === ' ') { e.preventDefault(); $('#ppBtn').click(); }
  else if (k === 't' || k === 'T') { if (armed) syncTap(); else tapNow(); }
  else if (k === 'h' || k === 'H') { if (pick) hear(pick.line); }
  else if (k === 'ArrowLeft' && pick) { e.preventDefault(); nudge(-0.1); }
  else if (k === 'ArrowRight' && pick) { e.preventDefault(); nudge(0.1); }
  else if (k === 'ArrowDown') { e.preventDefault(); stepLit(1); }
  else if (k === 'ArrowUp') { e.preventDefault(); stepLit(-1); }
  else if (k === 'Escape') { pick = null; armed = null; renderSong(); }
});
document.addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG') t.classList.add('broken'); }, true); // a cover that won't load just disappears
$('#ver').textContent = 'v' + VERSION;
