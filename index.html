<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17112E">
<title>Jhapat</title>
<meta name="description" content="Party player for the grab-the-word game: pick the items on the table and it drops into a random song a few seconds before one of them is sung.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&family=Yatra+One&display=swap">
<style>
/* Look: "Tihar Night" (mood board direction A). The party is after dark with the lights low, so the screen glows like a
   diyo: night indigo, marigold for anything you press, diyo cream for text, tika red for accents; a marigold garland
   under the header and rangoli dots behind the song that's playing. Yatra One (one weight: never bold it) for
   display, Mukta for reading. Phone-first single column, video pinned at the top; Play / Songs / Items tabs below. */
:root{
  --bg:#17112E; --surface:#211A44; --raise:#2D2457; --line:#3B3170; --line-2:#4A3F85;
  --ink:#FFF4E0; --muted:#C9BEE6;
  --gold:#FFC861; --gold-fill:#FFA41B; --gold-ink:#1A1206; --saffron:#FF6B1A;
  --red:#FF5A6E; --red-soft:#4A2140; --ok:#7EE2A8; --warn:#FFC861;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.35);
  --glow:0 0 0 4px rgba(255,164,27,.22), 0 10px 32px rgba(255,138,0,.45);
  --display:"Yatra One", "Mukta", system-ui, sans-serif;
  --body:"Mukta", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);
  padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--gold)}
button{font:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding-block:calc(14px + env(safe-area-inset-top,0px)) 10px}
.brand{display:flex;align-items:baseline;gap:9px}
.brand .word{font:400 34px/1 var(--display);color:var(--ink)}
.brand .dev{font:400 23px/1 var(--display);color:var(--gold-fill)}
.tabs{display:flex;background:var(--raise);border-radius:999px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;color:var(--muted);font:700 15px/1 var(--body);padding:10px 15px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
/* a marigold garland: big orange flowers with small yellow ones between */
.garland{height:20px;background-image:radial-gradient(circle,#FF8A00 0 7px,transparent 8px),radial-gradient(circle,#FFC233 0 4px,transparent 5px);
  background-size:20px 20px,20px 20px;background-position:0 0,10px 0;background-repeat:repeat-x}

/* player */
.stage{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px 8px}
.screen{position:relative;width:100%;height:clamp(200px,56.25vw,330px);border-radius:20px;overflow:hidden;background:#000;border:1px solid var(--line);box-shadow:0 14px 36px rgba(0,0,0,.45)}
.ytbox{position:absolute;inset:0;z-index:1}
.ytbox.front{z-index:2}
.ytbox>*{position:absolute;inset:0;width:100%;height:100%;border:0}
.stage.small .screen{width:356px;max-width:100%;height:200px;margin-inline:auto}
.screen{transition:height .3s ease}
/* the video box stays folded away until the first song plays, so the first screen is the table and Start */
.stage.off{position:static;padding:0}
.stage.off .screen{height:0;border-width:0;box-shadow:none}
.screen .idle{position:absolute;inset:0;z-index:3;background:#000;display:grid;place-items:center;color:var(--muted);font:600 15px/1.4 var(--body);text-align:center;padding:16px;pointer-events:none}
#tapHint{position:absolute;z-index:4;left:8px;right:8px;top:8px;background:var(--gold-fill);color:var(--gold-ink);font:700 15px/1.3 var(--body);padding:10px 12px;border-radius:12px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.45)}
#blocked{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;padding:18px;background:#120D26;color:var(--ink);font:600 15px/1.4 var(--body);text-align:center}
#blocked b{font:400 23px/1.15 var(--display)}
#blocked span{max-width:40ch;color:var(--muted)}
#blocked a{color:var(--gold-fill);font:800 18px/1.2 var(--body);word-break:break-all}

/* cards + type */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}
h2{font:400 24px/1.15 var(--display);margin:0 0 6px;text-wrap:balance;color:var(--ink)}
h2 .count{font:700 14px/1 var(--body);color:var(--muted);margin-left:4px}
.hint{color:var(--muted);margin:0 0 12px;font-size:15px;max-width:62ch}
.hint.small{font-size:14px;margin-top:8px}
.kicker{font:800 12px/1 var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--gold-fill);margin-bottom:7px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row.between{justify-content:space-between;margin-top:12px}
.lbl{font:700 13px/1 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--raise);color:var(--ink);font:700 15px/1.1 var(--body);
  padding:12px 15px;border-radius:14px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--gold-fill);border-color:transparent;color:var(--gold-ink)}
.btn.big{font:400 23px/1 var(--display);padding:16px 18px;min-height:62px;border-radius:18px}
.btn.primary.big{box-shadow:var(--glow)}
.btn.glow{animation:diyo 2.6s ease-in-out infinite} /* Start breathes like a diyo until the first drop */
@keyframes diyo{0%,100%{box-shadow:0 0 0 4px rgba(255,164,27,.18),0 8px 26px rgba(255,138,0,.35)}50%{box-shadow:0 0 0 7px rgba(255,164,27,.28),0 12px 40px rgba(255,138,0,.6)}}
.btn.wide{width:100%}
.btn.small{font-size:14px;padding:9px 12px;min-height:40px}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red-soft);margin-top:12px}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}
.mini{min-width:42px;min-height:42px;padding:0 8px;border-radius:12px;border:1px solid var(--line);background:var(--raise);color:var(--ink);font:700 15px/1 var(--body);cursor:pointer}
:is(.btn,.mini,.chip,.tap,.songbtn,.listbtn,.tabs button):focus-visible{outline:3px solid var(--gold-fill);outline-offset:2px}

/* play tab */
.now{background-color:var(--surface);background-image:radial-gradient(rgba(255,90,110,.42) 1.3px,transparent 1.8px);background-size:18px 18px}
.now .title{font:400 28px/1.1 var(--display);text-wrap:balance}
.now .meta{color:var(--muted);margin-top:3px}
.now .row{margin-top:12px}
.reveal{font-size:16px}
.reveal b{color:var(--gold-fill)}
.bigrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px;margin-top:14px}
.bigrow.solo{grid-template-columns:minmax(0,1fr)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:baseline;gap:6px;border:1.5px solid var(--line-2);background:transparent;color:var(--ink);
  border-radius:999px;padding:9px 13px;font:700 15px/1 var(--body);cursor:pointer}
.chip .d{font-weight:600;color:var(--muted)}
.chip .em{font-size:18px;line-height:1;align-self:center}
.chip .n{font:800 12px/1 var(--body);color:var(--ink);font-variant-numeric:tabular-nums;background:var(--raise);border-radius:999px;padding:3px 7px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .d{color:inherit;opacity:.7}
.chip[aria-pressed="true"] .n{background:var(--gold-fill);color:var(--gold-ink)}
.chip.more{border-style:dashed;color:var(--gold)}
.pool{margin:14px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-variant-numeric:tabular-nums;color:var(--muted)}
.pool b{color:var(--ink)}
.leadrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper output{min-width:3ch;text-align:center;font:400 23px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--gold-fill)}
.plbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-2px 0 14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.plbar span{min-width:0}
.plbar .pn{font:400 20px/1.15 var(--display);display:block}
.plbar .ps{color:var(--muted);font-size:14px}
/* settings: one folded card under the table */
.set{padding:0}
.sethead{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--ink);padding:16px 18px;cursor:pointer;text-align:left;font:inherit;border-radius:20px}
.sethead .h{font:400 21px/1 var(--display)}
.sethead .sum{color:var(--muted);font-size:14px;flex:1;min-width:0}
.sethead .chev{width:10px;height:10px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px 0;transition:transform .2s}
.sethead[aria-expanded="true"] .chev{transform:rotate(225deg);margin:4px 4px 0 0}
.setbody{padding:0 18px 18px;display:grid;gap:12px}
.setbody .leadrow{margin:0}
.setbody .hint{margin:-6px 0 0}
.sethead:focus-visible{outline:3px solid var(--gold-fill);outline-offset:-3px}
/* playlist cards: three song covers fanned out like photos on the table */
.listbtn.has-fan{grid-template-columns:100px minmax(0,1fr);align-items:center;column-gap:14px}
.listbtn .lb{display:grid;gap:7px;min-width:0}
.fan{position:relative;width:100px;height:70px}
.fan img{position:absolute;width:66px;height:37px;object-fit:cover;border-radius:6px;border:2px solid var(--ink);background:var(--raise);box-shadow:0 4px 12px rgba(0,0,0,.45)}
.fan img:nth-child(1){left:0;top:24px;transform:rotate(-10deg)}
.fan img:nth-child(2){left:17px;top:6px;transform:rotate(4deg)}
.fan img:nth-child(3){left:32px;top:28px;transform:rotate(11deg)}
img.broken{visibility:hidden}
/* version and update */
.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:22px;font-variant-numeric:tabular-nums}
.foot a{color:var(--muted)}
.update{display:block;margin:10px auto 0;border:1.5px solid var(--gold-fill);background:var(--raise);color:var(--ink);border-radius:999px;padding:8px 14px;font:700 14px/1.2 var(--body);cursor:pointer}
.update b{color:var(--gold)}
.lists{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.listbtn{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:18px;padding:16px;cursor:pointer;display:grid;gap:7px}
.listbtn .t{font:400 23px/1.15 var(--display)}
.listbtn .a{color:var(--muted);font-size:15px}
.listbtn .row{gap:6px}
.listbtn[aria-current="true"]{border-color:var(--gold-fill);box-shadow:inset 0 0 0 1px var(--gold-fill),var(--glow)}
.switch{display:flex;align-items:center;gap:10px;font-weight:600}
.switch input{width:22px;height:22px;accent-color:var(--gold-fill)}

/* songs */
.songs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.songbtn{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:12px 14px;cursor:pointer;display:grid;gap:4px}
.songbtn .t{font:400 21px/1.15 var(--display)}
.songbtn .a{color:var(--muted);font-size:14px}
.songbtn .row{margin-top:4px;gap:6px}
.badge{display:inline-block;font:700 12px/1 var(--body);padding:5px 8px;border-radius:999px;background:var(--raise);color:var(--muted);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.badge.ok{color:var(--ok)} .badge.warn{color:var(--warn)} .badge.bad{color:var(--red)}
.form{display:grid;gap:8px}
.form label{font-weight:700;font-size:14px;margin-top:4px}
input[type=text],input[type=url],textarea{width:100%;font:16px/1.3 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:12px}
textarea{margin:10px 0 8px;resize:vertical}

/* tagger */
.crumb{margin-top:12px}
.songhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.songhead .a{color:var(--muted)}
.transport{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.clock{margin-left:auto;font:400 23px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--gold-fill)}
.tapgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tap{min-height:76px;border-radius:16px;border:0;background:var(--raise);color:var(--ink);font:400 23px/1 var(--display);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;touch-action:manipulation}
.tap small{font:600 15px/1 var(--body);color:var(--muted)}
.tap.hit{animation:hit .4s ease-out}
@keyframes hit{from{background:var(--gold-fill);color:var(--gold-ink)}to{background:var(--raise)}}
.tags{list-style:none;margin:0;padding:0}
.tagrow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.tagrow:last-child{border-bottom:0}
.tagrow .time{font:700 16px/1 var(--body);font-variant-numeric:tabular-nums}
.tagrow .acts{display:flex;gap:4px}
.itemlist{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.itemrow{display:grid;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.itemrow:last-child{border-bottom:0;padding-bottom:0}
.ihead{display:flex;align-items:center;gap:10px}
.iname{font:400 22px/1 var(--display);flex:1;min-width:0}
.iname .d{font:400 17px/1 var(--display);color:var(--muted)}
.itemrow .meta{color:var(--muted);font-size:14px}

#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);
  padding:12px 16px;border-radius:14px;font:600 15px/1.35 var(--body);width:max-content;max-width:min(92vw,560px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.tap.hit{animation:none;outline:3px solid var(--gold-fill)} #toast{transition:none} .btn.glow{animation:none} .screen,.sethead .chev{transition:none}}
@media (max-width:360px){.listbtn.has-fan{grid-template-columns:80px minmax(0,1fr)}.fan{transform:scale(.8);transform-origin:left center}}
@media (max-width:380px){.tabs button{padding:9px 11px}.brand .word{font-size:29px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="word">Jhapat</span><span class="dev" lang="ne">झपट</span></div>
    <nav class="tabs" aria-label="Sections">
      <button data-act="tab" data-arg="play" aria-selected="true">Play</button>
      <button data-act="tab" data-arg="songs" aria-selected="false">Songs</button>
      <button data-act="tab" data-arg="items" aria-selected="false">Items</button>
    </nav>
  </header>
</div>
<div class="garland" aria-hidden="true"></div>
<div class="wrap"><button class="update" id="update" data-act="update" hidden>New version <b></b> is out · Reload</button></div>
<div class="stage off">
  <div class="wrap">
    <div class="screen">
      <div class="idle" id="idle">Loading the video…</div>
      <div class="ytbox front" id="boxA"><div id="ytA"></div></div>
      <div class="ytbox" id="boxB"><div id="ytB"></div></div>
      <div id="tapHint" hidden></div>
      <div id="blocked" hidden></div>
    </div>
  </div>
</div>
<main class="wrap" id="view"></main>
<footer class="wrap foot"><span id="ver"></span> · <a href="studio/">Studio</a></footer>
<div id="toast" role="status" aria-live="polite"></div>

function parseYT(input) {
  const s = (input || '').trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  try {
    const u = new URL(s), h = u.hostname.replace(/^(www|m|music)\./, '');
    if (h === 'youtu.be') return (u.pathname.slice(1).match(/^[\w-]{11}/) || [null])[0];
    if (/(^|\.)youtube(-nocookie)?\.com$/.test(h)) {
      const v = u.searchParams.get('v'); if (v && /^[\w-]{11}/.test(v)) return v.slice(0, 11);
      const m = u.pathname.match(/\/(?:shorts|embed|live|v)\/([\w-]{11})/); if (m) return m[1];
    }
  } catch (e) {}
  return null;
}

    case 'update': location.href = location.pathname + '?v=' + (b.dataset.v || Date.now()) + location.hash; break;
    case 'pause': case 'ttoggle': togglePause(); setTimeout(tick, 120); break;
    case 'reveal': revealed = true; renderNow(); break;
    case 'replay': if (current && byId(current.songId)) { revealed = false; playSong(byId(current.songId), current.start, 'game'); renderNow(); } break;
    case 'stay': clearTimeout(nextTimer); nextTimer = null; renderNow(); break;
    case 'item': { const it = itemById(arg); if (it) { it.on = !it.on; touched.add(it.id); rememberTable(); save(); render(); schedulePreload(1200, true); } break; }
    case 'lists': picking = true; render(); window.scrollTo(0, 0); break;
    case 'keeppl': picking = false; render(); break;
    case 'pickpl': await pickPlaylist(arg); break;
    case 'lead': {
      const st = S.settings;
      if (arg === 'min-') st.minLead = Math.max(1, st.minLead - 1);
      if (arg === 'min+') st.minLead = Math.min(st.maxLead, st.minLead + 1);
      if (arg === 'max-') st.maxLead = Math.max(st.minLead, st.maxLead - 1);
      if (arg === 'max+') st.maxLead = Math.min(30, st.maxLead + 1);
      save(); render(); schedulePreload(1200, true); break;
    }
    case 'balance': S.settings.balance = Math.min(10, Math.max(0, S.settings.balance + (arg === '+' ? 1 : -1))); save(); render(); schedulePreload(1200, true); break;
    case 'reset': S.played = []; save(); render(); toast('Every song is back in the list.'); break;
    case 'open': songId = arg; syncing = null; render(); window.scrollTo(0, 0); break;
    case 'back': songId = null; syncing = null; render(); break;
    case 'tstart': if (song) { syncing = null; playSong(song, 0, 'tag'); render(); } break;
    case 'tskip': if (ready && song && isOn(song)) { player.seekTo(Math.max(0, now() + Number(arg)), true); } break;
    case 'tap': tapTag(arg); break;
    case 'undo': if (lastTap) { const s2 = byId(lastTap.songId); if (s2) { const i = s2.tags.indexOf(lastTap.tag); if (i > -1) s2.tags.splice(i, 1); save(); } lastTap = null; render(); } break;
    case 'lag': S.settings.lag = Math.min(1, Math.max(0, Math.round((S.settings.lag + (arg === '+' ? 0.05 : -0.05)) * 100) / 100)); save(); render(); break;
    case 'sync': startSync(); break;
    case 'synctap': syncTap(); break;
    case 'synccancel': syncing = null; render(); break;
    case 'off': if (song) { song.offset = Math.round(((song.offset || 0) + Number(arg)) * 100) / 100; song.sync = 'ok'; save(); render(); } break;
    case 'ttest': if (song && song.tags[arg]) { playSong(song, song.tags[arg].t + (song.offset || 0) - 3, 'tag'); } break;
    case 'tnudge': if (song) { const [i, d] = arg.split(':'); const t = song.tags[i]; if (t) { t.t = Math.max(0, Math.round((t.t + Number(d)) * 100) / 100); t.src = 'tap'; sortTags(song); save(); render(); } } break;
    case 'tdel': if (song) { song.tags.splice(Number(arg), 1); save(); render(); } break;
    case 'delsong':
      if (song && confirm('Delete “' + song.title + '” and its ' + song.tags.length + ' tags?')) {
        S.songs = S.songs.filter(x => x.id !== song.id); S.played = S.played.filter(x => x !== song.id);
        if (current && current.songId === song.id) current = null;
        songId = null; save(); render(); toast('Deleted.');
      } break;
    case 'delitem': {
      const it = itemById(arg); if (!it) break;
      const n = S.songs.reduce((a, s) => a + s.tags.filter(t => t.item === it.id).length, 0);
      if (confirm('Delete ' + it.name + (n ? ' and its ' + n + ' tags' : '') + '?')) {
        S.items = S.items.filter(x => x.id !== it.id);
        S.songs.forEach(s => { s.tags = s.tags.filter(t => t.item !== it.id); });
        save(); render();
      } break;
    }
    case 'copy': {
      const txt = backupText(), box = $('#importBox');
      try { await navigator.clipboard.writeText(txt); toast('Backup copied. Paste it into Notes or a message to keep it.'); }
      catch (err) { if (box) { box.value = txt; box.select(); } toast('Copying was blocked, so the backup is in the box below. Select it and copy.'); }
      break;
    }
    case 'dl': {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([backupText()], { type: 'application/json' }));
      a.download = 'jhapat-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); a.remove(); break;
    }
    case 'import': {
      const raw = ($('#importBox') || {}).value || '';
      try {
        const d = JSON.parse(raw);
        if (!d || d.v !== 1 || !Array.isArray(d.songs) || !Array.isArray(d.items)) throw new Error('shape');
        if (!confirm('Replace everything here with this backup (' + d.songs.length + ' songs)?')) break;
        S = upgrade(d); S.songs.forEach(sortTags); current = null; songId = null; save(); render(); toast('Backup loaded.');
      } catch (err) { toast('That isn’t a Jhapat backup. Paste the whole text you copied.'); }
      break;
    }
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'autoNext') { S.settings.autoNext = e.target.checked; save(); }
  if (e.target.id === 'preload') { S.settings.preload = e.target.checked; save(); if (e.target.checked) schedulePreload(300); else discardPre(); renderNow(); }
  if (e.target.id === 'small') { S.settings.small = e.target.checked; save(); applySmall(); }
  const w = e.target.dataset && e.target.dataset.words;
  if (w) { const it = itemById(w); if (it) { it.words = e.target.value.trim(); save(); toast('Saved.'); } }
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'addForm') {
    const link = $('#addLink').value, vid = parseYT(link);
    if (!vid) { toast('That doesn’t look like a YouTube link. Copy it from the Share button on the video.'); return; }
    const title = $('#addTitle').value.trim(), artist = $('#addArtist').value.trim();
    const song = { id: 's' + Date.now().toString(36), title: title || 'New song', artist, videos: [vid], vi: 0, offset: 0, sync: 'ok', tags: [] };
    S.songs.push(song); save(); songId = song.id; render(); window.scrollTo(0, 0);
    if (!title) {
      try {
        const r = await fetch('https://noembed.com/embed?url=' + encodeURIComponent('https://youtu.be/' + vid));
        const d = await r.json();
        if (d && d.title) { song.title = d.title; save(); render(); }
        if (d && d.error) toast('YouTube says: ' + d.error + '. This video may not play here.');
      } catch (err) {}
    }
  }
  if (f.id === 'vidForm') {
    const song = byId(songId), vid = parseYT($('#vidLink').value);
    if (!song) return;
    if (!vid) { toast('That doesn’t look like a YouTube link.'); return; }
    song.videos = [vid].concat(song.videos.filter(x => x !== vid)); song.vi = 0; song.broken = false;
    if (song.tags.length) { song.offset = 0; song.sync = 'check'; }
    save(); render(); toast('Switched. Press Play from start to try it.');
  }
  if (f.id === 'itemForm') {
    const name = $('#iName').value.trim(); if (!name) return;
    let id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'item';
    while (itemById(id)) id += '-2';
    S.items.push({ id, name, dev: $('#iDev').value.trim(), words: $('#iWords').value.trim(), on: true });
    save(); render(); toast(name + ' added and turned on. Tag it in your songs.');
  }
});

function applySmall() { document.querySelector('.stage').classList.toggle('small', !!S.settings.small); }

/* ---------- songs from the studio's database ----------
   The official playlist loads on every visit and is kept on the phone, so a party without signal still has it.
   If the database has never answered on this phone, the songs built into this page are used instead. */
const DB = { rest: 'https://hckzkaprxywohazohmcu.supabase.co/rest/v1/', key: 'sb_publishable_BxH35gKGU8uwTsn-jGur9g_a_L-b98T', playlist: 'party-mix' };
const ON_BY_DEFAULT = ['paani', 'phool', 'chiya', 'paisa', 'chithi'];
function atVideo(song) { // a song moved to its next upload: use that upload's own offset
  if (song.offsets) { song.offset = song.offsets[song.vi || 0] || 0; song.sync = (song.synced || [])[song.vi || 0] ? 'ok' : 'check'; }
  else if (song.tags.length) { song.offset = 0; song.sync = 'check'; }
}
/* The items someone turns on or off are remembered for that playlist (only real choices, not the defaults it opened with). */
function rememberTable() {
  if (S.source !== 'db' || !S.playlist) return;
  (S.tables = S.tables || {})[S.playlist.id] = S.items.filter(i => i.on).map(i => i.id);
}
function applyBundle(b) {
  // A playlist opened for the first time starts with what's on the table now, plus any item all of its songs have (a Maya Round opens with Maya on).
  const wasOn = new Map(S.items.map(i => [i.id, i.on]));
  const mem = (S.tables || {})[b.id], playable = b.songs.filter(s => s.videos && s.videos.length);
  const inAll = id => playable.length > 0 && playable.every(s => (s.tags || []).some(t => t[0] === id));
  S.items = b.items.map(i => ({ id: i.id, name: i.name, dev: i.dev || '', emoji: i.emoji || '', words: '', note: i.note || '',
    on: mem ? mem.includes(i.id) : inAll(i.id) || (wasOn.has(i.id) ? !!wasOn.get(i.id) : ON_BY_DEFAULT.includes(i.id)) }));
  S.songs = b.songs.filter(s => s.videos && s.videos.length).map(s => ({
    id: s.id, title: s.title, artist: s.artist || '', vi: 0,
    videos: s.videos.map(v => v.yt), offsets: s.videos.map(v => Number(v.offset) || 0), synced: s.videos.map(v => !!v.synced),
    offset: Number(s.videos[0].offset) || 0, sync: s.videos[0].synced ? 'ok' : 'check',
    tags: (s.tags || []).map(([item, t, g]) => ({ item, t: Number(t), g: g == null ? null : Number(g), src: 'db' })).sort((x, y) => x.t - y.t) }));
  S.source = 'db'; S.playlist = { id: b.id, name: b.name }; S.dbAt = Date.now();
  (S.bundles = S.bundles || {})[b.id] = b; // every playlist opened here stays on the phone for parties without signal
  S.played = S.played.filter(id => S.songs.some(s => s.id === id));
  save(); render(); schedulePreload(1200, true);
}
const goodBundle = b => !!b && Array.isArray(b.songs) && b.songs.length > 0 && Array.isArray(b.items);
async function dbGet(path, body) {
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = setTimeout(() => ctl && ctl.abort(), 8000);
  try {
    const r = await fetch(DB.rest + path, body
      ? { method: 'POST', signal: ctl ? ctl.signal : undefined, headers: { apikey: DB.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
      : { signal: ctl ? ctl.signal : undefined, headers: { apikey: DB.key } });
    return r.ok ? await r.json() : null;
  } catch (e) { return null; } // offline or blocked: keep what this phone already has
  finally { clearTimeout(timer); }
}
const bundleOf = pid => dbGet('rpc/playlist_bundle', { pid });
async function loadDb() {
  if (typeof fetch !== 'function') return;
  const pid = (S.source === 'db' && S.playlist && S.playlist.id) || DB.playlist;
  const [cards, b] = await Promise.all([
    dbGet('playlist_cards?select=*&owner=is.null&is_public=is.true&order=sort,name'), bundleOf(pid)]);
  if (Array.isArray(cards)) S.cards = cards.map(c => ({ id: c.id, name: c.name, description: c.description || '', songs: Number(c.songs) || 0, items: c.items || {},
    thumbs: (Array.isArray(c.thumbs) ? c.thumbs : []).filter(x => /^[\w-]{11}$/.test(x)) }));
  if (goodBundle(b)) return applyBundle(b);
  if (pid !== DB.playlist && Array.isArray(cards) && !cards.some(c => c.id === pid)) { // that playlist is gone: back to the party mix
    const d = await bundleOf(DB.playlist); if (goodBundle(d)) return applyBundle(d);
  }
  save(); render();
}
async function pickPlaylist(pid) {
  if (loadingList) return;
  if (S.source === 'db' && S.playlist && S.playlist.id === pid) { S.chosen = true; picking = false; save(); render(); toast('Turn on the items you’ve put out, then press Start.'); return; }
  loadingList = pid; render();
  let b = await bundleOf(pid);
  if (!goodBundle(b)) b = (S.bundles || {})[pid] || null; // offline: the copy from the last time it was opened here
  loadingList = null;
  if (!goodBundle(b)) { render(); toast('Couldn’t load that playlist. Check the internet connection and try again.'); return; }
  discardPre(); S.chosen = true; picking = false;
  applyBundle(b);
  toast(b.name + ': turn on the items you’ve put out, then press Start.');
}

document.addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG') t.classList.add('broken'); }, true);
applySmall();
$('#ver').textContent = 'v' + VERSION;
render();
loadDb();
checkVersion();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkVersion(); });
})();
</script>
</body>
