<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jhapat</title>
<meta name="description" content="Party player for the grab-the-word game: pick the items on the table and it drops into a random song a few seconds before one of them is sung.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Mukta:wght@400;600;700&display=swap">
<style>
/* Layout: phone-first single column. Video pinned at the top so it stays visible; Play / Songs / Items tabs underneath. */
:root{
  --bg:#f3f1f8; --surface:#ffffff; --raise:#ebe7f3; --ink:#221a35; --muted:#625a78; --line:#dcd6e7;
  --gold:#8f5b00; --gold-fill:#ffb000; --gold-ink:#1d1406;
  --red:#c8193f; --red-soft:#f7d7df; --ok:#14774a; --warn:#985600;
  --shadow:0 1px 2px rgba(34,26,53,.08), 0 6px 18px rgba(34,26,53,.07);
  --display:"Baloo 2", ui-rounded, system-ui, sans-serif;
  --body:"Mukta", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#120e1f; --surface:#1c172d; --raise:#272040; --ink:#f2eef9; --muted:#aaa1c0; --line:#352c4e;
    --gold:#ffc14d; --gold-fill:#ffb000; --gold-ink:#1d1406;
    --red:#ff5c7c; --red-soft:#47202d; --ok:#4ade80; --warn:#fbbf24;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);
  padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--gold)}
button{font:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding-block:calc(12px + env(safe-area-inset-top,0px)) 10px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand .word{font:800 30px/1 var(--display);letter-spacing:-.01em}
.brand .dev{font:600 19px/1 var(--display);color:var(--gold)}
.tabs{display:flex;background:var(--raise);border-radius:999px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;color:var(--muted);font:700 15px/1 var(--body);padding:10px 15px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
/* a strip of dhaka-weave triangles */
.dhaka{height:7px;opacity:.9;background:
  linear-gradient(135deg,var(--red) 25%,transparent 25%) -7px 0/14px 14px,
  linear-gradient(225deg,var(--red) 25%,transparent 25%) -7px 0/14px 14px,
  linear-gradient(315deg,var(--ink) 25%,transparent 25%) 0 0/14px 14px,
  linear-gradient(45deg,var(--ink) 25%,transparent 25%) 0 0/14px 14px,
  var(--gold-fill)}

/* player */
.stage{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:10px 6px}
.screen{position:relative;width:100%;height:clamp(200px,56.25vw,330px);border-radius:16px;overflow:hidden;background:#000;box-shadow:var(--shadow)}
#yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.screen .idle{position:absolute;inset:0;display:grid;place-items:center;color:#cfc7e2;font:600 15px/1.4 var(--body);text-align:center;padding:16px;pointer-events:none}
#tapHint{position:absolute;left:8px;right:8px;top:8px;background:#ffb000;color:#1d1406;font:700 15px/1.3 var(--body);padding:10px 12px;border-radius:10px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#blocked{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;padding:18px;background:#120e1f;color:#f2eef9;font:600 15px/1.4 var(--body);text-align:center}
#blocked b{font:800 21px/1.15 var(--display)}
#blocked span{max-width:40ch;color:#cfc7e2}
#blocked a{color:#ffc14d;font:800 18px/1.2 var(--body);word-break:break-all}

/* cards + type */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
h2{font:800 21px/1.15 var(--display);margin:0 0 6px;text-wrap:balance}
h2 .count{font:700 14px/1 var(--body);color:var(--muted);margin-left:4px}
.hint{color:var(--muted);margin:0 0 12px;font-size:15px;max-width:62ch}
.hint.small{font-size:14px;margin-top:8px}
.kicker{font:700 12px/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--gold);margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row.between{justify-content:space-between;margin-top:12px}
.lbl{font:700 13px/1 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--raise);color:var(--ink);font:700 15px/1.1 var(--body);
  padding:12px 15px;border-radius:12px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--gold-fill);border-color:transparent;color:var(--gold-ink)}
.btn.big{font:800 20px/1 var(--display);padding:16px 18px;min-height:60px}
.btn.wide{width:100%}
.btn.small{font-size:14px;padding:9px 12px;min-height:40px}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red-soft);margin-top:12px}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}
.mini{min-width:42px;min-height:42px;padding:0 8px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--ink);font:700 15px/1 var(--body);cursor:pointer}
:is(.btn,.mini,.chip,.tap,.songbtn,.tabs button):focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* play tab */
.now .title{font:800 24px/1.12 var(--display);text-wrap:balance}
.now .meta{color:var(--muted);margin-top:2px}
.now .row{margin-top:12px}
.reveal{font-size:16px}
.bigrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:baseline;gap:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:9px 13px;font:700 15px/1 var(--body);cursor:pointer}
.chip .d{font-weight:600;color:var(--muted)}
.chip .n{font:700 12px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums;background:var(--raise);border-radius:999px;padding:3px 6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .d{color:inherit;opacity:.75}
.chip[aria-pressed="true"] .n{background:var(--gold-fill);color:var(--gold-ink)}
.pool{margin:14px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.leadrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper output{min-width:3ch;text-align:center;font:800 21px/1 var(--display);font-variant-numeric:tabular-nums}
.switch{display:flex;align-items:center;gap:10px;font-weight:600}
.switch input{width:22px;height:22px;accent-color:var(--gold-fill)}

/* songs */
.songs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.songbtn{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;cursor:pointer;display:grid;gap:4px}
.songbtn .t{font:800 19px/1.15 var(--display)}
.songbtn .a{color:var(--muted);font-size:14px}
.songbtn .row{margin-top:4px;gap:6px}
.badge{display:inline-block;font:700 12px/1 var(--body);padding:5px 8px;border-radius:999px;background:var(--raise);color:var(--muted);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.badge.ok{color:var(--ok)} .badge.warn{color:var(--warn)} .badge.bad{color:var(--red)}
.form{display:grid;gap:8px}
.form label{font-weight:700;font-size:14px;margin-top:4px}
input[type=text],input[type=url],textarea{width:100%;font:16px/1.3 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
textarea{margin:10px 0 8px;resize:vertical}

/* tagger */
.crumb{margin-top:12px}
.songhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.songhead .a{color:var(--muted)}
.transport{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.clock{margin-left:auto;font:800 22px/1 var(--display);font-variant-numeric:tabular-nums}
.tapgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tap{min-height:76px;border-radius:14px;border:0;background:var(--raise);color:var(--ink);font:800 22px/1 var(--display);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;touch-action:manipulation}
.tap small{font:600 15px/1 var(--body);color:var(--muted)}
.tap.hit{animation:hit .4s ease-out}
@keyframes hit{from{background:var(--gold-fill);color:var(--gold-ink)}to{background:var(--raise)}}
.tags{list-style:none;margin:0;padding:0}
.tagrow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.tagrow:last-child{border-bottom:0}
.tagrow .time{font:700 16px/1 var(--body);font-variant-numeric:tabular-nums}
.tagrow .acts{display:flex;gap:4px}
.itemlist{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.itemrow{display:grid;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.itemrow:last-child{border-bottom:0;padding-bottom:0}
.ihead{display:flex;align-items:center;gap:10px}
.iname{font:800 20px/1 var(--display);flex:1;min-width:0}
.iname .d{font:600 16px/1 var(--display);color:var(--muted)}
.itemrow .meta{color:var(--muted);font-size:14px}

#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);
  padding:12px 16px;border-radius:12px;font:600 15px/1.35 var(--body);width:max-content;max-width:min(92vw,560px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.tap.hit{animation:none;outline:3px solid var(--gold)} #toast{transition:none}}
@media (max-width:380px){.tabs button{padding:9px 11px}.brand .word{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="word">Jhapat</span><span class="dev" lang="ne">झपट</span></div>
    <nav class="tabs" aria-label="Sections">
      <button data-act="tab" data-arg="play" aria-selected="true">Play</button>
      <button data-act="tab" data-arg="songs" aria-selected="false">Songs</button>
      <button data-act="tab" data-arg="items" aria-selected="false">Items</button>
    </nav>
  </header>
</div>
<div class="dhaka" aria-hidden="true"></div>
<div class="stage">
  <div class="wrap">

      <div class="idle" id="idle">The video shows here once a song starts.</div>
      <div id="yt"></div>
      <div id="tapHint" hidden></div>
      <div id="blocked" hidden></div>

  </div>
</div>
<main class="wrap" id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>

const fmt = t => { if (!isFinite(t) || t < 0) t = 0; const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };
const T = (item, times) => times.map(t => ({ item, t, src: 'auto' }));

/* Older saves get new seed songs, and seed songs the person hasn't tapped, nudged or synced get the latest videos and timings. */
function upgrade(d) {
  if ((d.seedV || 1) >= SEED_V) return d;
  const fresh = seed();
  fresh.songs.forEach(s => {
    const mine = d.songs.find(x => x.id === s.id);
    if (!mine) d.songs.push(s);
    else if (!mine.offset && !mine.tags.some(t => t.src !== 'auto')) Object.assign(mine, { videos: s.videos, vi: 0, offset: 0, sync: s.sync, tags: s.tags, broken: false });
  });
  fresh.items.forEach(it => {
    const mine = d.items.find(x => x.id === it.id);
    if (!mine) d.items.push(it);
    else if (it.id === 'paisa' && !/daam/.test(mine.words || '')) mine.words = (mine.words ? mine.words + ', ' : '') + 'daam';
  });
  d.seedV = SEED_V;
  return d;
}
function loadState() {

  $('#view').innerHTML = tab === 'play' ? renderPlay() : tab === 'items' ? renderItems() : (songId ? renderSong() : renderSongs());
  tick();
}
function renderNow() { const n = document.querySelector('.now'); if (n && tab === 'play') n.innerHTML = nowHTML(); }
function tick() {
  const c = document.getElementById('clock'); if (c) c.textContent = fmt(now());
  const st = state();
  document.querySelectorAll('[data-pausebtn]').forEach(b => { b.textContent = st === 2 ? 'Resume' : 'Pause'; });
}
setInterval(tick, 200);

/* ---------- actions ---------- */
function parseYT(input) {
  const s = (input || '').trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  try {
    const u = new URL(s), h = u.hostname.replace(/^(www|m|music)\./, '');
    if (h === 'youtu.be') return (u.pathname.slice(1).match(/^[\w-]{11}/) || [null])[0];
    if (/(^|\.)youtube(-nocookie)?\.com$/.test(h)) {
      const v = u.searchParams.get('v'); if (v && /^[\w-]{11}/.test(v)) return v.slice(0, 11);
      const m = u.pathname.match(/\/(?:shorts|embed|live|v)\/([\w-]{11})/); if (m) return m[1];
    }
  } catch (e) {}
  return null;
}
function backupText() { return JSON.stringify(S); }

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, arg = b.dataset.arg, song = byId(songId);
  switch (act) {
    case 'tab': tab = arg; songId = null; syncing = null; render(); break;
    case 'next': nextRound(); break;
    case 'pause': case 'ttoggle': togglePause(); setTimeout(tick, 120); break;
    case 'reveal': revealed = true; renderNow(); break;
    case 'replay': if (current && byId(current.songId)) { revealed = false; playSong(byId(current.songId), current.start, 'game'); renderNow(); } break;
    case 'stay': clearTimeout(nextTimer); nextTimer = null; renderNow(); break;
    case 'item': { const it = itemById(arg); if (it) { it.on = !it.on; save(); render(); } break; }
    case 'lead': {
      const st = S.settings;
      if (arg === 'min-') st.minLead = Math.max(1, st.minLead - 1);
      if (arg === 'min+') st.minLead = Math.min(st.maxLead, st.minLead + 1);
      if (arg === 'max-') st.maxLead = Math.max(st.minLead, st.maxLead - 1);
      if (arg === 'max+') st.maxLead = Math.min(20, st.maxLead + 1);
      save(); render(); break;
    }
    case 'reset': S.played = []; save(); render(); toast('Every song is back in the list.'); break;
    case 'open': songId = arg; syncing = null; render(); window.scrollTo(0, 0); break;
    case 'back': songId = null; syncing = null; render(); break;
    case 'tstart': if (song) { syncing = null; playSong(song, 0, 'tag'); render(); } break;
    case 'tskip': if (ready && song && isOn(song)) { player.seekTo(Math.max(0, now() + Number(arg)), true); } break;
    case 'tap': tapTag(arg); break;
    case 'undo': if (lastTap) { const s2 = byId(lastTap.songId); if (s2) { const i = s2.tags.indexOf(lastTap.tag); if (i > -1) s2.tags.splice(i, 1); save(); } lastTap = null; render(); } break;
    case 'lag': S.settings.lag = Math.min(1, Math.max(0, Math.round((S.settings.lag + (arg === '+' ? 0.05 : -0.05)) * 100) / 100)); save(); render(); break;
    case 'sync': startSync(); break;
    case 'synctap': syncTap(); break;
    case 'synccancel': syncing = null; render(); break;
    case 'off': if (song) { song.offset = Math.round(((song.offset || 0) + Number(arg)) * 100) / 100; song.sync = 'ok'; save(); render(); } break;
    case 'ttest': if (song && song.tags[arg]) { playSong(song, song.tags[arg].t + (song.offset || 0) - 3, 'tag'); } break;
    case 'tnudge': if (song) { const [i, d] = arg.split(':'); const t = song.tags[i]; if (t) { t.t = Math.max(0, Math.round((t.t + Number(d)) * 100) / 100); t.src = 'tap'; sortTags(song); save(); render(); } } break;
    case 'tdel': if (song) { song.tags.splice(Number(arg), 1); save(); render(); } break;
    case 'delsong':
      if (song && confirm('Delete “' + song.title + '” and its ' + song.tags.length + ' tags?')) {
        S.songs = S.songs.filter(x => x.id !== song.id); S.played = S.played.filter(x => x !== song.id);
        if (current && current.songId === song.id) current = null;
        songId = null; save(); render(); toast('Deleted.');
      } break;
    case 'delitem': {
      const it = itemById(arg); if (!it) break;
      const n = S.songs.reduce((a, s) => a + s.tags.filter(t => t.item === it.id).length, 0);
      if (confirm('Delete ' + it.name + (n ? ' and its ' + n + ' tags' : '') + '?')) {
        S.items = S.items.filter(x => x.id !== it.id);
        S.songs.forEach(s => { s.tags = s.tags.filter(t => t.item !== it.id); });
        save(); render();
      } break;
    }
    case 'copy': {
      const txt = backupText(), box = $('#importBox');
      try { await navigator.clipboard.writeText(txt); toast('Backup copied. Paste it into Notes or a message to keep it.'); }
      catch (err) { if (box) { box.value = txt; box.select(); } toast('Copying was blocked, so the backup is in the box below. Select it and copy.'); }
      break;
    }
    case 'dl': {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([backupText()], { type: 'application/json' }));
      a.download = 'jhapat-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); a.remove(); break;
    }
    case 'import': {
      const raw = ($('#importBox') || {}).value || '';
      try {
        const d = JSON.parse(raw);
        if (!d || d.v !== 1 || !Array.isArray(d.songs) || !Array.isArray(d.items)) throw new Error('shape');
        if (!confirm('Replace everything here with this backup (' + d.songs.length + ' songs)?')) break;
        S = upgrade(d); S.songs.forEach(sortTags); current = null; songId = null; save(); render(); toast('Backup loaded.');
      } catch (err) { toast('That isn’t a Jhapat backup. Paste the whole text you copied.'); }
      break;
    }
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'autoNext') { S.settings.autoNext = e.target.checked; save(); }
  const w = e.target.dataset && e.target.dataset.words;
  if (w) { const it = itemById(w); if (it) { it.words = e.target.value.trim(); save(); toast('Saved.'); } }
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'addForm') {
    const link = $('#addLink').value, vid = parseYT(link);
    if (!vid) { toast('That doesn’t look like a YouTube link. Copy it from the Share button on the video.'); return; }
    const title = $('#addTitle').value.trim(), artist = $('#addArtist').value.trim();
    const song = { id: 's' + Date.now().toString(36), title: title || 'New song', artist, videos: [vid], vi: 0, offset: 0, sync: 'ok', tags: [] };
    S.songs.push(song); save(); songId = song.id; render(); window.scrollTo(0, 0);
    if (!title) {
      try {
        const r = await fetch('https://noembed.com/embed?url=' + encodeURIComponent('https://youtu.be/' + vid));
        const d = await r.json();
        if (d && d.title) { song.title = d.title; save(); render(); }
        if (d && d.error) toast('YouTube says: ' + d.error + '. This video may not play here.');
      } catch (err) {}
    }
  }
  if (f.id === 'vidForm') {
    const song = byId(songId), vid = parseYT($('#vidLink').value);
    if (!song) return;
    if (!vid) { toast('That doesn’t look like a YouTube link.'); return; }
    song.videos = [vid].concat(song.videos.filter(x => x !== vid)); song.vi = 0; song.broken = false;
    if (song.tags.length) { song.offset = 0; song.sync = 'check'; }
    save(); render(); toast('Switched. Press Play from start to try it.');
  }
  if (f.id === 'itemForm') {
    const name = $('#iName').value.trim(); if (!name) return;
    let id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'item';
    while (itemById(id)) id += '-2';
    S.items.push({ id, name, dev: $('#iDev').value.trim(), words: $('#iWords').value.trim(), on: true });
    save(); render(); toast(name + ' added and turned on. Tag it in your songs.');
  }
});

render();
})();
</script>
</body>
</html>
