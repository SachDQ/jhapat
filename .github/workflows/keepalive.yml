# Supabase pauses free projects after about a week of low activity; this keeps the song database awake between parties.
name: Keep the database awake
on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the party playlist once
        run: |
          curl -fsS -o /dev/null -X POST "https://hckzkaprxywohazohmcu.supabase.co/rest/v1/rpc/playlist_bundle" \
            -H "apikey: sb_publishable_BxH35gKGU8uwTsn-jGur9g_a_L-b98T" -H "Content-Type: application/json" -d '{"pid":"party-mix"}'
